name: Web CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - name: Install dependencies from lockfile
        run: yarn install --immutable
      - name: Check API lock and generated client
        run: yarn api:check
      - name: Check lockfile is unchanged
        run: git diff --exit-code -- yarn.lock openapi.lock.json src/shared/api/generated/openapi.ts
      - name: Check formatting
        run: yarn format:check
      - name: Lint
        run: yarn lint
      - name: Type check
        run: yarn type-check
      - name: Unit tests
        run: yarn test
      - name: Verify Docker configuration
        run: yarn test:docker
      - name: Build static site
        run: yarn build
      - name: Build production Web image
        run: >-
          docker build --pull --tag aster-drive-web:ci
          --build-arg VITE_API_BASE_URL=https://ci.invalid/api
          --build-arg VITE_ROOT_RESOURCE_ID=ci-root
          .
      - name: Scan production Web image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: aster-drive-web:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Install Playwright browser
        run: yarn playwright install --with-deps chromium
      - name: Run E2E tests
        run: yarn test:e2e
