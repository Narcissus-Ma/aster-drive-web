name: Web Deploy

# 部署由外部环境负责，保留手动触发仅用于临时检查。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - name: Install dependencies from lockfile
        run: yarn install --immutable
      - name: Verify pinned API client
        run: yarn api:check
      - name: Validate public build variables
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_ROOT_RESOURCE_ID: ${{ vars.VITE_ROOT_RESOURCE_ID }}
        run: |
          test -n "$VITE_API_BASE_URL"
          test -n "$VITE_ROOT_RESOURCE_ID"
          case "$VITE_API_BASE_URL" in
            https://*) ;;
            *) echo "VITE_API_BASE_URL must use HTTPS"; exit 1 ;;
          esac
      - name: Build static site
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_ROOT_RESOURCE_ID: ${{ vars.VITE_ROOT_RESOURCE_ID }}
        run: yarn build
      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  container:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/aster-drive-web
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_ROOT_RESOURCE_ID: ${{ vars.VITE_ROOT_RESOURCE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate public build variables
        run: |
          test -n "$VITE_API_BASE_URL"
          test -n "$VITE_ROOT_RESOURCE_ID"
          case "$VITE_API_BASE_URL" in
            https://*) ;;
            *) echo "VITE_API_BASE_URL must use HTTPS"; exit 1 ;;
          esac
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
            VITE_ROOT_RESOURCE_ID=${{ env.VITE_ROOT_RESOURCE_ID }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
      - name: Scan published Web image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to static CDN
        id: deployment
        uses: actions/deploy-pages@v4
