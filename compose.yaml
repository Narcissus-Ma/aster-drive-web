name: aster-drive-web

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL must be set}
        VITE_ROOT_RESOURCE_ID: ${VITE_ROOT_RESOURCE_ID:?VITE_ROOT_RESOURCE_ID must be set}
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    restart: unless-stopped
